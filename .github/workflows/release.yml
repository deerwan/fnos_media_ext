name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要补发的 tag，例如 v0.1.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Verify tag matches VERSION
        run: |
          version="$(head -n1 VERSION | tr -d '[:space:]')"
          tag="${TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "ERROR: tag v$tag does not match VERSION $version" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build admin web
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          mkdir -p proxy/static
          cp -a web/dist/. proxy/static/

      - name: Install Python dependencies and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests

      - name: Download fnpack
        run: |
          curl -fsSL -o fnpack \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          chmod +x fnpack && sudo mv fnpack /usr/local/bin/fnpack
        env:
          FNPACK_VERSION: "1.2.3"

      - name: Build fpk package
        run: bash packaging/fpk/build.sh

      - name: Verify package artifact
        run: |
          fpk_file="$(ls dist/fnos_media_ext-*.fpk)"
          test -s "$fpk_file" && test -s "${fpk_file}.sha256"
          ( cd dist && sha256sum -c "$(basename "$fpk_file").sha256" )

      - name: Build release notes
        run: |
          prev="$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            git log --no-merges --oneline "$prev..HEAD" > /tmp/release-notes.md
          else
            git log --no-merges --oneline HEAD > /tmp/release-notes.md
          fi
          sed -i 's/^/- /' /tmp/release-notes.md
          head -20 /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fpk_file="$(ls dist/fnos_media_ext-*.fpk)"
          title="fnos_media_ext ${TAG#v}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "$title" --notes-file /tmp/release-notes.md
            gh release upload "${TAG}" "$fpk_file" "$fpk_file.sha256" --clobber
          else
            gh release create "${TAG}" --title "$title" \
              --notes-file /tmp/release-notes.md \
              "$fpk_file" "$fpk_file.sha256"
          fi
